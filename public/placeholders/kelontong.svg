<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-kl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F7F1E4"/>
    </linearGradient>
  </defs>
  
  <!-- Background Card -->
  <rect width="400" height="400" rx="36" fill="url(#bg-kl)"/>
  
  <!-- Subtle Badge Circle -->
  <circle cx="200" cy="180" r="100" fill="#F8ECC8" opacity="0.6"/>
  <circle cx="200" cy="180" r="80" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Store Front / Awning -->
  <path d="M140 160 H260 L250 135 H150 Z" fill="#E11D48" stroke="#BE123C" stroke-width="6" stroke-linejoin="round"/>
  <!-- Awning Scallops -->
  <path d="M140 160 Q150 172 160 160 Q170 172 180 160 Q190 172 200 160 Q210 172 220 160 Q230 172 240 160 Q250 172 260 160" fill="none" stroke="#BE123C" stroke-width="6"/>
  
  <!-- Store Body -->
  <rect x="150" y="165" width="100" height="75" rx="4" fill="none" stroke="#059669" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Shopping Basket / Door -->
  <rect x="185" y="195" width="30" height="45" rx="3" fill="#10B981" opacity="0.4"/>
  
  <!-- Label -->
  <rect x="90" y="305" width="220" height="34" rx="17" fill="#059669" opacity="0.1"/>
  <text x="200" y="327" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#059669" text-anchor="middle" letter-spacing="0.5">
    KELONTONG &amp; SEMBAKO
  </text>
</svg>
