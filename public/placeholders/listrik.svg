  <line x1="200" y1="95" x2="200" y2="105" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="110" x2="168" y2="118" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <line x1="240" y1="110" x2="232" y2="118" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Label -->
  <rect x="95" y="305" width="210" height="34" rx="17" fill="#7C3AED" opacity="0.1"/>
  <text x="200" y="327" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle" letter-spacing="0.5">
