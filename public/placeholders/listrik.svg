      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
  </defs>
  
  <!-- Background Card -->
  <rect width="400" height="400" rx="36" fill="url(#bg-lt)"/>
  
  <!-- Subtle Badge Circle -->
  <circle cx="200" cy="180" r="100" fill="#E9D5FF" opacity="0.6"/>
  <circle cx="200" cy="180" r="80" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Lightbulb / Power -->
  <path d="M175 140 C175 125 186 115 200 115 C214 115 225 125 225 140 C225 155 215 165 215 178 H185 C185 165 175 155 175 140 Z" fill="none" stroke="#7C3AED" stroke-width="8" stroke-linejoin="round"/>
  <!-- Bulb Base -->
  <rect x="187" y="186" width="26" height="8" rx="3" fill="#7C3AED"/>
  <rect x="190" y="198" width="20" height="7" rx="3" fill="#A855F7"/>
